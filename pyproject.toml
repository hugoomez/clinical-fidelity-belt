[project]
name = "idonia-recog-orchestrator"
version = "1.0.0"
description = "A quantitative fidelity gate for patient-facing radiology reports, orchestrating the Idonia and Recog clinical APIs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Hugo Gómez García", email = "nanaysonic@gmail.com" },
]
keywords = [
    "clinical-nlp",
    "patient-facing-reports",
    "radiology",
    "llm-as-a-judge",
    "health-literacy",
    "spanish-nlp",
    "medical-ai-safety",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "pydantic>=2.5,<3",
    "httpx>=0.27,<1",
    "textstat>=0.7.3,<1",
    "google-genai>=1.0,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "python-multipart>=0.0.9",
]
ml = [
    "transformers>=4.40,<5",   # BSCBiomedicalNER, NLIEntailment
    "torch>=2.2,<3",
]
live = [
    "pyjwt>=2.8,<3",           # IdoniaLiveClient: self-signed JWT
    "pymupdf>=1.24,<2",        # RecogLiveClient: text extraction from Recog's PDF
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["idonia_recog*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "RUF001",  # ambiguous unicode in Spanish clinical strings is intentional
    "RUF002",
    "RUF003",
    "RUF022",  # __all__ is grouped by module on purpose; alphabetical hides that
]

[tool.ruff.lint.isort]
# Keep `from x import a, b as c` on one statement instead of splitting per alias.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# The evaluation scripts configure stdout encoding before importing the package.
"scripts/*" = ["E402"]
# The immutability tests assert that *any* mutation raises; narrowing the
# exception type would test Pydantic's internals rather than the contract.
"tests/test_domain.py" = ["B017"]
"tests/test_belt.py" = ["B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:google.genai.types",
]
